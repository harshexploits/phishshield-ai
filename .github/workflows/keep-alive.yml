name: Keep Alive

on:
  schedule:
    # Every minute (minimum allowed by GitHub Actions)
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PhishShield AI
        run: |
          echo "Pinging at $(date -u)"
          curl -s -o /dev/null -w "Health: %{http_code}\n" https://phishxrecon.onrender.com/_stcore/health || true
          sleep 5
          curl -s -o /dev/null -w "Home: %{http_code}\n" https://phishxrecon.onrender.com/ || true
