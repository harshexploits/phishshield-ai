name: Keep-Alive Ping

on:
  schedule:
    - cron: '* * * * *'   # every minute
  workflow_dispatch:        # manual trigger button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping phishxrecon.onrender.com
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}" https://phishxrecon.onrender.com/_stcore/health
          echo " — $(date -u)"
