name: Keep Alive

on:
  schedule:
    # Every 4 minutes (cron minimum is 5, but GitHub supports */4 with workflow_dispatch)
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Manual trigger button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping PhishShield AI
        run: |
          echo "Pinging https://phishxrecon.onrender.com at $(date -u)"
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://phishxrecon.onrender.com/_stcore/health || true
          sleep 10
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" https://phishxrecon.onrender.com/ || true
